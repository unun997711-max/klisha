name: Build Levi
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Prepare project
        run: |
          set -e
          mkdir -p www
          cat > www/index.html <<'LEVIEOF'
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <title>LEVI</title>
          <style>
          :root{--bg:#000;--panel:#0d0d10;--line:#1c1c22;--red:#e11d2e;--txt:#f2f2f2;--dim:#8a8a94}
          *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
          html,body{height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,sans-serif;overflow:hidden}
          button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
          [data-av]{display:contents}
          #splash{position:fixed;inset:0;z-index:50;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity .7s,transform .7s}
          #splash.out{opacity:0;transform:scale(1.15);pointer-events:none}
          #splash::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#3a0a10 0,#000 62%)}
          #logo{position:relative;display:flex;direction:ltr;font-family:'Bebas Neue',Impact,sans-serif;font-size:min(30vw,150px);letter-spacing:.14em;line-height:1;padding-left:.14em}
          #logo span{display:inline-block;opacity:0;transform:translateY(-120vh) rotate(-25deg);color:#fff;text-shadow:0 0 18px #e11d2e,0 0 2px #fff;animation:drop .9s cubic-bezier(.3,1.5,.5,1) forwards}
          #logo span:nth-child(1){animation-delay:.3s}#logo span:nth-child(2){animation-delay:.55s}
          #logo span:nth-child(3){animation-delay:.8s}#logo span:nth-child(4){animation-delay:1.05s}
          #logo span:nth-child(5){animation-delay:1.3s;color:var(--red)}
          @keyframes drop{to{opacity:1;transform:none}}
          #tag{position:absolute;bottom:7vh;z-index:2;color:var(--dim);font-size:14px;opacity:0;animation:fade 1s 2.2s forwards}
          @keyframes fade{to{opacity:1}}
          #app{position:fixed;inset:0;display:none;flex-direction:column}
          header{padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
          header b{font-family:'Bebas Neue',Impact,sans-serif;font-size:30px;letter-spacing:.2em;direction:ltr}
          header b i{color:var(--red);font-style:normal}
          .dot{width:9px;height:9px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e}
          main{flex:1;overflow:hidden;position:relative}
          nav{display:flex;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);background:var(--panel)}
          nav button{flex:1;padding:12px 0 9px;color:var(--dim);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
          nav button .ic{font-size:21px}
          nav button.on{color:#fff}
          nav button.on .ic{filter:drop-shadow(0 0 6px var(--red))}
          .m{max-width:80%;padding:9px 13px;border-radius:16px;line-height:1.5;font-size:15px;white-space:pre-wrap;word-break:break-word}
          .me{align-self:flex-start;background:var(--red);border-bottom-right-radius:4px}
          .bot{align-self:flex-end;background:#17171c;border:1px solid var(--line);border-bottom-left-radius:4px}
          .xo{display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center;margin-top:8px}
          .xo button{height:64px;font-size:30px;font-weight:900;padding:0;background:#17171c;border:1px solid #2a2a33;border-radius:12px}
          #bar{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);align-items:center}
          #bar input{flex:1;min-width:0;background:#121216;border:1px solid var(--line);border-radius:22px;padding:11px 16px;color:#fff;font:inherit;outline:none}
          #bar input:focus{border-color:var(--red)}
          .rb{width:42px;height:42px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-size:18px}
          .rb.g{background:#17171c;border:1px solid #2a2a33}
          #bar .rb{width:38px;height:38px;flex:none;font-size:17px}
          .item{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
          .item div.t{flex:1}.item small{color:var(--dim);display:block}
          .item input[type=checkbox]{width:20px;height:20px;accent-color:#e11d2e}
          #call{position:fixed;inset:0;z-index:40;background:radial-gradient(circle at 50% 30%,#3a0a10,#000 70%);display:none;flex-direction:column;align-items:center;justify-content:space-around;padding:60px 20px}
          #call .av{width:140px;height:140px;font-size:64px;border-radius:50%;background:#17171c;border:2px solid var(--red);display:grid;place-items:center;animation:pulse 1.6s infinite}
          @keyframes pulse{0%{box-shadow:0 0 0 0 #e11d2e88}100%{box-shadow:0 0 0 40px #e11d2e00}}
          #end{width:70px;height:70px;border-radius:50%;background:var(--red);font-size:28px}
          .crow{display:flex;gap:40px}
          @media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
          .fld{width:100%;background:#121216;border:1px solid var(--line);border-radius:14px;padding:13px 15px;color:#fff;font:inherit;outline:none;margin-bottom:10px}
          .fld:focus{border-color:var(--red)}
          .btn{background:var(--red);border-radius:14px;padding:13px;font-weight:700;width:100%}
          .btn.o{background:none;border:1px solid #2a2a33}
          .hint{color:var(--dim);font-size:13px;display:block;margin:4px 0 8px}
          #auth{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;justify-content:center;padding:30px;background:#000}
          #auth h1{font-family:'Bebas Neue',Impact,sans-serif;font-size:72px;letter-spacing:.2em;text-align:center;direction:ltr;margin-bottom:20px}
          #auth h1 i{color:var(--red);font-style:normal}
          #err{color:#f87171;font-size:13px;min-height:20px;text-align:center}
          #page{position:absolute;inset:0;overflow-y:auto}
          .post{border-bottom:1px solid var(--line);padding-bottom:10px}
          .ph{display:flex;align-items:center;gap:10px;padding:10px 14px}
          .pa{width:38px;height:38px;border-radius:50%;border:2px solid var(--red);object-fit:cover;display:grid;place-items:center;background:#17171c;font-weight:700;flex:none}
          .post img.pi{width:100%;display:block}
          .pf{padding:8px 14px}.pf p{margin-top:4px;font-size:14px}
          .pro{padding:20px;text-align:center}.pro .pa{width:96px;height:96px;margin:0 auto 10px;font-size:38px}
          .st{display:flex;justify-content:center;gap:28px;margin:14px 0}.st b{display:block;font-size:18px}.st small{color:var(--dim)}
          .gr{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.gr img{width:100%;aspect-ratio:1;object-fit:cover}
          .row2{display:flex;gap:8px;padding:0 20px;flex-wrap:wrap}.row2 .btn{flex:1;min-width:30%}
          .top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#000;z-index:2}
          .who{display:flex;align-items:center;gap:8px;flex:1;min-width:0}.who b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .cv{position:absolute;inset:0;display:flex;flex-direction:column;background:#000;z-index:5}
          .cv #cm{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
          .gcard{align-self:center;max-width:92%;text-align:center;background:#0d0d10;border:1px solid #2a2a33;border-radius:16px;padding:10px 12px}
          .gcard button{font-size:18px;padding:6px 12px;margin:2px;background:#17171c;border:1px solid #2a2a33;border-radius:12px}
          .gcard .xo button{height:60px;font-size:28px;padding:0}.gcard button:disabled{opacity:.55}
          .gcard .row{margin-top:6px}
          .gm{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--line);flex-wrap:wrap}
          .gm button{background:#17171c;border:1px solid #2a2a33;border-radius:12px;padding:8px 14px}
          .coin{color:#fbbf24;font-weight:700;font-size:14px;direction:ltr;display:inline-block}
          .vb{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:#fff;color:#e11d2e;font:900 10px Arial,sans-serif;margin:0 4px;vertical-align:middle}
          .fire{display:inline-flex;align-items:center;gap:1px;font-weight:800;font-size:13px;color:var(--c);vertical-align:middle;margin:0 4px}
          .fire svg{width:17px;height:17px;fill:var(--c);filter:drop-shadow(0 0 4px var(--c));animation:fl 1.1s infinite}
          @keyframes fl{50%{transform:scale(1.14) translateY(-1px)}}
          .stkpop{position:fixed;left:50%;top:50%;z-index:60;text-align:center;pointer-events:none;animation:fly 2.4s forwards}
          .stkpop svg{width:110px;height:110px;fill:var(--c);filter:drop-shadow(0 0 22px var(--c))}
          .stkpop div{font-size:46px;font-weight:900;color:var(--c);line-height:1}
          .stkpop small{color:#fff;font-size:15px}
          @keyframes fly{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.5)}65%{opacity:1;transform:translate(-50%,-50%) scale(1.5)}100%{opacity:0;transform:translate(10vw,-46vh) scale(.25)}}
          #toast{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translateX(-50%);background:#17171cf2;border:1px solid #2a2a33;border-radius:14px;padding:10px 16px;z-index:90;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;font-size:14px;text-align:center}
          .chip{display:inline-block;background:#17171c;border:1px solid #2a2a33;border-radius:20px;padding:5px 14px;font-size:14px;margin-top:6px}
          .mus{margin-top:12px}.mus audio{width:100%}.mus iframe{width:100%;height:180px;border:0;border-radius:12px}
          .tabs{display:flex;margin-top:16px;border-bottom:1px solid var(--line)}
          .tabs button{flex:1;padding:11px;color:var(--dim);font-size:14px;border-bottom:2px solid transparent}
          .tabs button.on{color:#fff;border-bottom-color:var(--red)}
          .gg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px}
          .gg .gi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 2px;text-align:center}
          .gg .gi span{font-size:30px;display:block}.gg .gi small{color:#fbbf24;font-weight:700}
          .gg .gi .pa{width:26px;height:26px;font-size:12px;margin:3px auto;border-width:1px}
          .gu{display:block;font-size:10px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px}
          .gp{position:absolute;inset:0;background:#000f;z-index:8;overflow-y:auto;padding:12px;display:none}
          .gph{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;position:sticky;top:-12px;background:#000;padding:6px 0}
          .gg2{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
          .gg2 button{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
          .gg2 button span{font-size:30px}.gg2 small{font-size:10px;color:var(--dim)}.gg2 i{font-style:normal;color:#fbbf24;font-size:12px;font-weight:700}
          .gg2 button:active{background:var(--red)}
          #wbox{display:none;border-bottom:1px solid var(--line);background:#050507}
          #wtop{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;font-size:13px;color:var(--dim)}
          #wpw{position:relative;width:100%;aspect-ratio:16/9}
          #wpw iframe{position:absolute;inset:0;width:100%;height:100%}
          .sbar{display:flex;gap:12px;overflow-x:auto;padding:12px 14px;border-bottom:1px solid var(--line)}
          .sbar>div{flex:none;width:62px;text-align:center;font-size:11px}
          .sbar .pa{width:54px;height:54px;margin:0 auto 5px;font-size:22px}
          .sbar small{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--dim)}
          .pa.sr{border-color:#a855f7;box-shadow:0 0 0 2px #000,0 0 0 4px #a855f7}
          .pa.sr.cl{border-color:#22c55e;box-shadow:0 0 0 2px #000,0 0 0 4px #22c55e}
          #sv{position:fixed;inset:0;z-index:65;background:#000;display:none;flex-direction:column}
          #sv img{flex:1;min-height:0;width:100%;object-fit:contain}
          .svb{display:flex;gap:3px;padding:calc(env(safe-area-inset-top) + 8px) 10px 6px}
          .svb i{flex:1;height:3px;background:#444;border-radius:2px}.svb i.d,.svb i.c{background:#fff}
          .svh{display:flex;align-items:center;gap:8px;padding:6px 12px}.svh b{flex:1}.svh small{color:var(--dim)}
          .svh .pa{width:34px;height:34px;font-size:14px}
          .svf{display:flex;gap:8px;padding:10px 14px calc(env(safe-area-inset-bottom) + 10px)}
          .hlr{display:flex;gap:12px;overflow-x:auto;padding:12px 16px}
          .hlr img{width:60px;height:60px;border-radius:50%;object-fit:cover;border:2px solid #a855f7;flex:none}
          .mi{max-width:100%;max-height:300px;border-radius:12px;display:block}
          .m audio{display:block;margin-top:6px;max-width:100%;height:36px}
          #cp{position:fixed;inset:0;z-index:66;background:#000;display:flex;flex-direction:column}
          .cph{display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;border-bottom:1px solid var(--line)}
          #cl{flex:1;overflow-y:auto}
          .cmi{display:flex;gap:10px;padding:10px 14px;align-items:flex-start;border-bottom:1px solid var(--line)}
          .cmi .t{flex:1;min-width:0;font-size:14px;word-break:break-word;white-space:pre-wrap}
          .cmi .pa{width:34px;height:34px;font-size:14px}
          #bar2{display:flex;gap:8px;padding:10px 10px calc(env(safe-area-inset-bottom) + 10px);border-top:1px solid var(--line);align-items:center}
          #bar2 input{flex:1;min-width:0;background:#121216;border:1px solid var(--line);border-radius:22px;padding:11px 16px;color:#fff;font:inherit;outline:none}
          #bar2 input:focus{border-color:var(--red)}
          </style>
          </head>
          <body>
          <div id="splash" onclick="enter()">
          <div id="logo"><span>L</span><span>E</span><span>V</span><span>I</span><span>.</span></div>
          <div id="tag">المس الشاشة للدخول</div>
          </div>
          <div id="toast"></div>
          <div id="auth">
          <h1>LEV<i>I</i></h1>
          <input id="au" class="fld" placeholder="اسم المستخدم (انكليزي)" autocapitalize="none" autocomplete="off" dir="ltr">
          <input id="ap" class="fld" type="password" placeholder="كلمة السر (6 أحرف+)" dir="ltr">
          <p id="err"></p>
          <button class="btn" onclick="A.auth(false)">دخول</button><br>
          <button class="btn o" onclick="A.auth(true)">حساب جديد</button>
          </div>
          <div id="app">
          <header><span class="dot"></span><b>LEV<i>I</i></b><span id="hc" class="coin">🪙 0</span></header>
          <main><div id="page"></div></main>
          <nav>
          <button data-v="feed" onclick="A.tab('feed')"><span class="ic">🏠</span>الرئيسية</button>
          <button data-v="search" onclick="A.tab('search')"><span class="ic">🔍</span>بحث</button>
          <button data-v="new" onclick="A.tab('new')"><span class="ic">➕</span>نشر</button>
          <button data-v="chats" onclick="A.tab('chats')"><span class="ic">💬</span>رسائل</button>
          <button data-v="me" onclick="A.tab('me')"><span class="ic">👤</span>أنا</button>
          </nav>
          </div>
          <div id="call"><div class="av" id="cav"></div><div style="text-align:center"><h2 id="cn"></h2><p id="cs" style="color:var(--dim)"></p></div><div class="crow"><button id="cacc" class="rb" style="width:70px;height:70px;background:#22c55e;font-size:28px" onclick="A.accept()">📞</button><button id="end" onclick="A.hang()">📵</button></div><audio id="ra" autoplay></audio></div>
          <script type="module">
          const firebaseConfig = {
          apiKey: "AIzaSyD50lO9JV1K3dwulxzjqD3lveoo3rF1dbk",
          authDomain: "levi-935b7.firebaseapp.com",
          projectId: "levi-935b7",
          storageBucket: "levi-935b7.firebasestorage.app",
          messagingSenderId: "317273207442",
          appId: "1:317273207442:web:65fa578ff5f96621ae2c4b"
          };
          import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
          import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
          import {getFirestore,doc,getDoc,setDoc,updateDoc,addDoc,deleteDoc,collection,query,where,orderBy,limit,onSnapshot,getDocs,arrayUnion,arrayRemove,increment} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
          const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
          const $=id=>document.getElementById(id);
          const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
          let me=null,meDoc=null,uns=[],entered=false,ready=false,busy=false,cur='feed',userUn=null,UC={},openCid=null,lastStk=-1,lvT=null,permAsked=false;
          let ST=[],SR={},SV=null,nkind=0,stUn=null,grUn=null,HLS=[],RC=null,cpUn=null;
          const uref=id=>doc(db,'users',id),cref=cid=>doc(db,'chats',cid);
          const kf=n=>{n=+n||0;const f=(v,s)=>(Math.floor(v*10+1e-9)/10).toString().replace(/\.0$/,'')+s;return n>=1e9?f(n/1e9,'B'):n>=1e6?f(n/1e6,'M'):n>=1e3?f(n/1e3,'K'):String(n)};
          const bad=u=>!!meDoc&&((meDoc.blocked||[]).includes(u)||(meDoc.restricted||[]).includes(u));
