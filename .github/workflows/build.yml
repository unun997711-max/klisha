          const opt={audioBitsPerSecond:24000};if(mt)opt.mimeType=mt;
          const r=new MediaRecorder(st,opt),ch=[],c=chatCtx,t0=Date.now();RC=r;
          const mic=$('mic');if(mic){mic.textContent='⏹';mic.style.background='#e11d2e'}
          r.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data)};
          const tm=setTimeout(()=>{if(r.state!=='inactive')r.stop()},60000);
          r.onstop=()=>{clearTimeout(tm);st.getTracks().forEach(x=>x.stop());RC=null;const m=$('mic');if(m){m.textContent='🎤';m.style.background=''}
          const dur=Math.round((Date.now()-t0)/1000);
          if(dur<1||!ch.length||!chatCtx||chatCtx.cid!==c.cid||openCid!==c.cid)return;
          const rd=new FileReader();rd.onload=async()=>{if(String(rd.result).length>900000)return toast('البصمة طويلة، قصّرها');
          await sendMsg({type:'aud',src:rd.result,d:dur},'🎤 بصمة صوتية')};
          rd.readAsDataURL(new Blob(ch,{type:r.mimeType||mt||'audio/webm'}))};
          r.start()}
          catch(e){RC=null;toast('تعذر تشغيل المايك: '+(e.message||e))}},
          gt(){const g=$('gm');g.style.display=g.style.display==='none'?'flex':'none'},
          async game(k){if(!await canMsg(chatCtx.uid))return;const o=chatCtx.uid;$('gm').style.display='none';
          if(k==='xo')await sendMsg({type:'xo',board:'---------',X:me.uid,O:o,turn:me.uid},'❌⭕ إكس أو');
          else if(k==='rps')await sendMsg({type:'rps',a:me.uid,b:o,picks:{}},'✊ حجرة ورقة مقص');
          else if(k==='wed'){if(meDoc.spouse)return toast('أنت متزوج بالفعل 💍');await sendMsg({type:'wed',to:o},'💍 طلب زواج')}},
          async xoPlay(id,i){const r=doc(db,'chats',chatCtx.cid,'msgs',id),x=(await getDoc(r)).data();if(!x||x.turn!==me.uid)return;const b=x.board.split('');if(b[i]!=='-'||xoWin(b))return;b[i]=x.X===me.uid?'X':'O';await updateDoc(r,{board:b.join(''),turn:x.X===me.uid?x.O:x.X})},
          async rpsPick(id,i){await updateDoc(doc(db,'chats',chatCtx.cid,'msgs',id),{['picks.'+me.uid]:i})},
          async wed(id,ok){const r=doc(db,'chats',chatCtx.cid,'msgs',id),x=(await getDoc(r)).data();if(!x||x.st||x.to!==me.uid)return;
          if(ok&&(meDoc.spouse||(await uc(x.from,true)).spouse)){toast('أحدكم متزوج بالفعل 💔');return}
          await updateDoc(r,{st:ok?'yes':'no'});
          if(ok){await updateDoc(uref(me.uid),{spouse:{uid:x.from}});await updateDoc(uref(x.from),{spouse:{uid:me.uid}});UC={}}},
          gifts(){const g=$('gp');g.style.display='block';
          g.innerHTML=`<div class="gph"><b>🎁 اختر هدية — 🪙 ${kf(meDoc.coins||0)}</b><button onclick="A.gx()" style="font-size:20px">✖</button></div><div class="gg2">${GIFTS.map((x,i)=>`<button onclick="A.gsend(${i})"><span>${x.e}</span><small>${esc(x.n)}</small><i>🪙 ${kf(gprice(i,chatCtx.mult))}</i></button>`).join('')}</div>`},
          gx(){$('gp').style.display='none'},
          async gsend(i){const p=gprice(i,chatCtx.mult);if((meDoc.coins||0)<p)return toast('عملاتك ما تكفي 🪙');if(!await canMsg(chatCtx.uid))return;
          A.gx();await updateDoc(uref(me.uid),{coins:increment(-p)});await sendMsg({type:'gift',gid:i,to:chatCtx.uid,st:'p',price:p},'🎁 هدية: '+GIFTS[i].n)},
          async gift(id,ok){const r=doc(db,'chats',chatCtx.cid,'msgs',id),x=(await getDoc(r)).data();if(!x||x.st!=='p'||x.to!==me.uid)return;
          if(ok){await updateDoc(r,{st:'yes'});await updateDoc(uref(me.uid),{giftList:arrayUnion({gid:x.gid,from:x.from,ts:Date.now()})})}
          else{await updateDoc(r,{st:'no'});await updateDoc(uref(x.from),{coins:increment(x.price||0)}).catch(()=>{})}},
          async watch(){const u=prompt('الصق رابط فيديو يوتيوب');if(!u)return;const v=ytid(u);if(!v)return toast('الرابط غير صحيح');
          await setDoc(cref(chatCtx.cid),{members:[me.uid,chatCtx.uid],watch:{vid:v,state:'pause',time:0,ts:Date.now(),by:''}},{merge:true})},
          async wclose(){await updateDoc(cref(chatCtx.cid),{watch:null}).catch(()=>{})},
          async call(){if(inCall||!await canMsg(chatCtx.uid))return;const cid=chatCtx.cid;
          try{inCall=true;callCid=cid;role='A';seen={A:0,B:0};callT=Date.now();showCall(chatCtx.uname,'جاري الاتصال...',false);
          await mkPc(cid);const o=await pc.createOffer();
          await setDoc(cref(cid),{members:[me.uid,chatCtx.uid],call:{from:me.uid,name:meDoc.username,status:'ringing',t:callT,offer:JSON.stringify(o),answer:null,iceA:[],iceB:[]}},{merge:true});
          await pc.setLocalDescription(o);
          setTimeout(()=>{if(inCall&&callCid===cid&&$('cs').textContent!=='متصل 🔊')A.hang()},45000)}
          catch(e){endLocal();toast('تعذر الاتصال: '+(e.message||e))}},
          async accept(){const cid=callCid;if(!cid)return;
          try{const c=(await getDoc(cref(cid))).data().call;await mkPc(cid);await pc.setRemoteDescription(JSON.parse(c.offer));
          const a=await pc.createAnswer();await updateDoc(cref(cid),{'call.status':'active','call.answer':JSON.stringify(a)});
          await pc.setLocalDescription(a);$('cs').textContent='متصل 🔊';$('cacc').style.display='none'}
          catch(e){endLocal();toast('تعذر الرد: '+(e.message||e))}},
          async hang(){const cid=callCid;endLocal();if(cid)updateDoc(cref(cid),{'call.status':'ended','call.t':Date.now()}).catch(()=>{})},
          async gnew(){const ids=[...new Set([...(meDoc.following||[]),...(meDoc.followers||[])])],us=await Promise.all(ids.map(i=>uc(i)));
          $('page').innerHTML=`<div class="top"><button onclick="A.tab('chats')">→</button><b>👥 كروب جديد</b></div><div style="padding:14px"><input id="gn" class="fld" placeholder="اسم الكروب"></div><div id="gl">${ids.map((id,k)=>`<label class="item"><input type="checkbox" value="${id}">${av(us[k].avatar,us[k].username)}<div class="t"><b>${esc(us[k].name||us[k].username)}</b><small>@${esc(us[k].username)}</small></div></label>`).join('')||'<p style="text-align:center;color:var(--dim);margin-top:40px">تابع أشخاص أولاً</p>'}</div><div style="padding:16px"><button class="btn" onclick="A.gmk()">إنشاء</button></div>`},
          async gmk(){const n=$('gn').value.trim(),v=[...document.querySelectorAll('#gl input:checked')].map(x=>x.value);
          if(!n||!v.length)return toast('اكتب الاسم واختر أشخاص');
          const r=await addDoc(collection(db,'groups'),{name:n,members:[me.uid,...v],admin:me.uid,last:'تم إنشاء الكروب',lastFrom:me.uid,ts:Date.now()});A.group(r.id)},
          async group(id){stop();const g=(await getDoc(doc(db,'groups',id))).data();if(!g)return;openCid=id;
          $('page').innerHTML=`<div class="cv"><div class="top"><button onclick="A.back()">→</button><div class="who"><b>👥 ${esc(g.name)}</b></div><small style="color:var(--dim)">${g.members.length} عضو</small></div><div id="cm"></div><div id="bar"><input id="mi" placeholder="اكتب رسالة..." autocomplete="off"><button class="rb" onclick="A.gsm('${id}')">➤</button></div></div>`;
          $('mi').onkeydown=e=>{if(e.key==='Enter')A.gsm(id)};
          uns.push(onSnapshot(query(collection(db,'groups',id,'msgs'),orderBy('ts'),limit(200)),s=>{const c=$('cm');if(!c)return;
          c.innerHTML=s.docs.map(d=>{const x=d.data(),m=x.from===me.uid;return `<div class="m ${m?'me':'bot'}">${m?'':'<small style="opacity:.6;display:block">'+esc(x.name)+'</small>'}${esc(x.text)}</div>`}).join('');c.scrollTop=c.scrollHeight}))},
          async gsm(id){const t=$('mi').value.trim();if(!t)return;$('mi').value='';
          await addDoc(collection(db,'groups',id,'msgs'),{from:me.uid,name:meDoc.username,text:t,ts:Date.now()});
          await updateDoc(doc(db,'groups',id),{last:meDoc.username+': '+t,lastFrom:me.uid,ts:Date.now()})}
          };
          async function sendMsg(data,last){const c=chatCtx;await addDoc(collection(db,'chats',c.cid,'msgs'),{...data,from:me.uid,ts:Date.now()});await meta(c.uid,c.cid,c.uname,last)}
          document.head.insertAdjacentHTML('beforeend','<meta name="referrer" content="strict-origin-when-cross-origin">');
          </script>
          </body>
          </html>
          LEVIEOF
      - name: Capacitor
        run: |
          set -e
          test -f www/index.html
          grep -q '</html>' www/index.html
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/local-notifications@7
          printf '{"appId":"com.levi.app","appName":"Levi","webDir":"www","server":{"androidScheme":"https","hostname":"levi.app"}}' > capacitor.config.json
          npx cap add android
          npx cap sync android
      - name: Permissions
        run: |
          set -e
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/><uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><application#' $M
          grep -c RECORD_AUDIO $M
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Levi-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
